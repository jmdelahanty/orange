# Orange rig (pancake0): pace page-cache writeback so the recorders' ~100 MB/s
# of MP4 output is flushed continuously instead of in ~3 GB bursts every 31 s.
# The bursts drive the NVMe at ~6 GB/s on the host bridge that A16 card A shares
# with all three drives and cost camera frames (2026-09-21). Install with:
#   sudo cp config/sysctl/90-orange-writeback.conf /etc/sysctl.d/ && sudo sysctl --system
# Revert: set both to 0 (the ratio defaults, 10 % / 20 % of RAM, take over).
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 536870912
