# Orange rig (pancake0): pace page-cache writeback so the recorders' ~100 MB/s
# of MP4 output is flushed continuously instead of in ~3 GB bursts every 31 s.
# The bursts drive the NVMe at ~6 GB/s on the host bridge that A16 card A shares
# with all three drives and cost camera frames (2026-09-21). Install with:
#   sudo cp config/sysctl/90-orange-writeback.conf /etc/sysctl.d/ && sudo sysctl --system
# Revert: set both to 0 (the ratio defaults, 10 % / 20 % of RAM, take over).
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 536870912

# Proactive memory compaction (kcompactd) migrates pages in the background to
# reduce fragmentation. Each migration flushes TLBs on the cores running the
# owning process, which on this host means Orange's acquisition and YOLO
# threads on the isolated cores: 2026-09-23 soaks showed kcompactd0 busiest
# in 15 of 18 seconds with >5000 IPIs/s on those cores. Nothing here needs
# hugepages (THP is madvise), so turn proactive compaction off.
vm.compaction_proactiveness = 0
